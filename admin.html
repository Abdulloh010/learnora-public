<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learnora Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0D1B4B;--blue:#1565C0;--cyan:#29ABE2;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --surface:#fff;--bg:#F4F7FF;--border:#E2E8F0;
  --gray-400:#94A3B8;--gray-600:#475569;--gray-800:#1E293B;
  --shadow:0 4px 16px rgba(13,27,75,0.10);
  --radius:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--gray-800);min-height:100vh}
/* ── layout ── */
.admin-layout{display:flex;min-height:100vh}
.admin-sidebar{width:240px;background:linear-gradient(160deg,#0D1B4B 0%,#1A2C6B 100%);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.admin-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.admin-brand span{font-size:1.3rem;font-weight:900;letter-spacing:-.02em}
.admin-brand span b{color:var(--cyan)}
.admin-brand small{display:block;font-size:.7rem;color:rgba(255,255,255,.5);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.admin-nav{padding:16px 0;flex:1}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:.875rem;font-weight:500;color:rgba(255,255,255,.7);border-left:3px solid transparent;transition:all .2s}
.admin-nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.admin-nav-item.active{background:rgba(41,171,226,.15);color:var(--cyan);border-left-color:var(--cyan)}
.admin-nav-item i{width:16px;text-align:center}
.admin-main{flex:1;padding:32px;overflow-y:auto}
/* ── cards ── */
.admin-header{margin-bottom:28px}
.admin-header h1{font-size:1.5rem;font-weight:800;color:var(--navy)}
.admin-header p{font-size:.875rem;color:var(--gray-400);margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat-card .stat-val{font-size:1.8rem;font-weight:900;color:var(--navy)}
.stat-card .stat-lbl{font-size:.78rem;color:var(--gray-400);margin-top:4px;font-weight:500}
.stat-card .stat-icon{font-size:1.4rem;margin-bottom:8px}
/* ── tables ── */
.admin-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
.admin-card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.admin-card-header h2{font-size:1rem;font-weight:700;color:var(--navy)}
.admin-table{width:100%;border-collapse:collapse}
.admin-table th{padding:10px 16px;text-align:left;font-size:.75rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:#fafafa}
.admin-table td{padding:12px 16px;font-size:.85rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.admin-table tr:last-child td{border-bottom:none}
.admin-table tr:hover td{background:#f8fafc}
/* ── application card ── */
.app-card{border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;background:var(--surface)}
.app-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.app-card-header h3{font-size:.95rem;font-weight:700;color:var(--navy)}
.app-card-header small{color:var(--gray-400);font-size:.78rem;display:block;margin-top:2px}
.app-field{margin-bottom:10px;font-size:.84rem}
.app-field strong{color:var(--gray-600);display:block;font-size:.73rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.app-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.73rem;font-weight:600}
.pill-blue{background:#e0f2fe;color:#0369a1}
.pill-green{background:#dcfce7;color:#15803d}
.pill-orange{background:#fff7ed;color:#c2410c}
.pill-red{background:#fee2e2;color:#b91c1c}
.pill-gray{background:#f1f5f9;color:#475569}
/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1251a3}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{filter:brightness(.9)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.9)}
.btn-ghost{background:#f1f5f9;color:var(--gray-800)}
.btn-ghost:hover{background:#e2e8f0}
.btn-sm{padding:5px 12px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ── form ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.82rem;font-weight:600;color:var(--gray-600);margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:.875rem;font-family:inherit;color:var(--gray-800);outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue)}
.form-textarea{min-height:120px;resize:vertical}
.quill-editor{min-height:200px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.quill-editor .ql-toolbar{border:none;border-bottom:1px solid var(--border);background:#fafafa}
.quill-editor .ql-container{border:none;font-size:.9rem;min-height:160px}
/* ── toast ── */
#adminToast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.a-toast{padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:slideIn .3s ease}
.a-toast.success{background:var(--success)}
.a-toast.error{background:var(--danger)}
.a-toast.info{background:var(--blue)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* ── video ── */
.video-pitch-player{width:100%;max-width:520px;border-radius:10px;background:#000}
/* ── empty ── */
.admin-empty{text-align:center;padding:48px 20px;color:var(--gray-400)}
.admin-empty i{font-size:2rem;margin-bottom:12px;display:block}
/* ── tabs ── */
.admin-tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:8px;padding:4px;margin-bottom:20px;width:fit-content}
.admin-tab{padding:7px 18px;border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--gray-400);border:none;background:none;transition:all .2s}
.admin-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* ── star rating ── */
.stars{color:#f59e0b;font-size:.9rem}
</style>
</head>
<body>
<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <span>Learn<b>ora</b></span>
      <small>Admin Panel</small>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-item active" onclick="showSection('overview')" id="nav-overview">
        <i class="fas fa-chart-pie"></i> Overview
      </div>
      <div class="admin-nav-item" onclick="showSection('applications')" id="nav-applications">
        <i class="fas fa-user-graduate"></i> Applications <span id="appsBadge" style="margin-left:auto;background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:10px;display:none"></span>
      </div>
      <div class="admin-nav-item" onclick="showSection('sessions')" id="nav-sessions">
        <i class="fas fa-video"></i> Sessions
      </div>
      <div class="admin-nav-item" onclick="showSection('users')" id="nav-users">
        <i class="fas fa-users"></i> Users
      </div>
      <div class="admin-nav-item" onclick="showSection('email')" id="nav-email">
        <i class="fas fa-envelope"></i> Send Email
      </div>
      <div class="admin-nav-item" onclick="showSection('reports')" id="nav-reports">
        <i class="fas fa-flag"></i> Reports <span id="reportsBadge" style="margin-left:auto;background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:10px;display:none"></span>
      </div>
    </nav>
    <div style="padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)">
      <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center" onclick="adminLogout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main" id="adminMain">
    <div class="admin-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
  </main>
</div>

<div id="adminToast"></div>

<script>
const ADMIN_TOKEN = localStorage.getItem('learnora_token');

/* ── Guard: redirect if not admin ────────────────────────── */
(async function() {
  if (!ADMIN_TOKEN) { window.location.href = 'index.html'; return; }
  const res = await aFetch('/api/auth.php?action=me');
  if (!res.success || (res.data.role || 'student') !== 'admin') {
    window.location.href = 'index.html';
    return;
  }
  loadStats();
  showSection('overview');
})();

/* ── API helper ──────────────────────────────────────────── */
async function aFetch(url, method = 'GET', body = null) {
  try {
    const opts = {
      method,
      headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN, 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(url, opts);
    return await r.json();
  } catch(e) { return { success: false, error: e.message }; }
}

function aToast(msg, type = 'success') {
  const t = document.getElementById('adminToast');
  const el = document.createElement('div');
  el.className = 'a-toast ' + type;
  el.textContent = msg;
  t.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

/* ── Navigation ──────────────────────────────────────────── */
let _currentSection = '';
function showSection(section) {
  _currentSection = section;
  document.querySelectorAll('.admin-nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + section);
  if (navEl) navEl.classList.add('active');
  const main = document.getElementById('adminMain');
  main.innerHTML = '<div class="admin-empty"><i class="fas fa-spinner fa-spin"></i></div>';
  if (section === 'overview')      renderOverview();
  else if (section === 'applications') renderApplications('pending');
  else if (section === 'sessions') renderSessions();
  else if (section === 'users')    renderUsers();
  else if (section === 'email')    renderEmail();
  else if (section === 'reports')  renderReports('open');
}

/* ── Cached stats ────────────────────────────────────────── */
let _stats = {};
async function loadStats() {
  const res = await aFetch('/api/admin.php?action=stats');
  if (res.success) {
    _stats = res.data;
    const badge = document.getElementById('appsBadge');
    if (badge && _stats.pending_applications > 0) {
      badge.textContent = _stats.pending_applications;
      badge.style.display = '';
    }
    const rBadge = document.getElementById('reportsBadge');
    if (rBadge && _stats.open_reports > 0) {
      rBadge.textContent = _stats.open_reports;
      rBadge.style.display = '';
    }
  }
}

/* ── Overview ────────────────────────────────────────────── */
async function renderOverview() {
  await loadStats();
  const s = _stats;
  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1>Admin Overview</h1>
      <p>Platform health at a glance</p>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-users" style="color:#6366f1"></i></div><div class="stat-val">${s.total_users||0}</div><div class="stat-lbl">Total Users</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-chalkboard-teacher" style="color:#0891b2"></i></div><div class="stat-val">${s.total_teachers||0}</div><div class="stat-lbl">Active Teachers</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-clipboard-list" style="color:#d97706"></i></div><div class="stat-val" style="color:var(--warning)">${s.pending_applications||0}</div><div class="stat-lbl">Pending Applications</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-check" style="color:#2563eb"></i></div><div class="stat-val">${s.total_sessions||0}</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-check" style="color:#059669"></i></div><div class="stat-val">${s.total_registrations||0}</div><div class="stat-lbl">Registrations</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-pen-to-square" style="color:#7c3aed"></i></div><div class="stat-val">${s.total_posts||0}</div><div class="stat-lbl">Community Posts</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-book-open" style="color:#0284c7"></i></div><div class="stat-val">${s.total_courses||0}</div><div class="stat-lbl">Courses</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-puzzle-piece" style="color:#be185d"></i></div><div class="stat-val">${s.total_quizzes||0}</div><div class="stat-lbl">Quizzes</div></div>
      <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-plus" style="color:#10b981"></i></div><div class="stat-val" style="color:var(--success)">${s.new_users_week||0}</div><div class="stat-lbl">New Users (7d)</div></div>
      ${(s.open_reports||0) > 0 ? `<div class="stat-card" style="cursor:pointer" onclick="showSection('reports')"><div class="stat-icon"><i class="fas fa-flag" style="color:#ef4444"></i></div><div class="stat-val" style="color:var(--danger)">${s.open_reports}</div><div class="stat-lbl">Open Reports</div></div>` : ''}
    </div>
    ${s.pending_applications > 0 ? `<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <i class="fas fa-exclamation-triangle" style="color:var(--warning);font-size:1.2rem"></i>
      <div>
        <div style="font-weight:700;color:#92400e">${s.pending_applications} pending teacher application${s.pending_applications!==1?'s':''}</div>
        <div style="font-size:.82rem;color:#b45309;margin-top:2px">Review them in the Applications tab</div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="showSection('applications')">Review →</button>
    </div>` : ''}
  `;
}

/* ── Applications ────────────────────────────────────────── */
let _appsFilter = 'pending';
async function renderApplications(filter) {
  _appsFilter = filter || _appsFilter;
  const res = await aFetch('/api/admin.php?action=applications&status=' + _appsFilter);
  const apps = res.success ? res.data : [];

  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1>Teacher Applications</h1>
      <p>Review applicants and manage the teacher verification queue</p>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab${_appsFilter==='pending'?' active':''}" onclick="renderApplications('pending')">Pending</button>
      <button class="admin-tab${_appsFilter==='approved'?' active':''}" onclick="renderApplications('approved')">Approved</button>
      <button class="admin-tab${_appsFilter==='declined'?' active':''}" onclick="renderApplications('declined')">Declined</button>
    </div>
    <div id="appsList">
      ${apps.length === 0
        ? '<div class="admin-empty"><i class="fas fa-check-circle"></i><p>No ' + _appsFilter + ' applications</p></div>'
        : apps.map(renderAppCard).join('')}
    </div>
  `;
}

function renderAppCard(a) {
  const tests     = tryParse(a.standardized_tests, []);
  const testSubs  = tryParse(a.test_subjects, {});
  const testScores= tryParse(a.test_scores, {});
  const subjects  = tryParse(a.subjects_to_teach, []);
  const statusPill = {
    pending:  'pill-orange',
    approved: 'pill-green',
    declined: 'pill-red',
  }[a.status] || 'pill-gray';

  return `
  <div class="app-card" id="app-${a.id}">
    <div class="app-card-header">
      <div>
        <h3>${esc(a.full_name)} <span class="pill ${statusPill}" style="font-size:.7rem;vertical-align:middle">${a.status}</span></h3>
        <small>@${esc(a.username)} &bull; Applied ${formatDate(a.submitted_at)}</small>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="app-field"><strong>Age</strong>${a.age || '—'}</div>
      <div class="app-field"><strong>Location</strong>${esc(a.location) || '—'}</div>
      <div class="app-field"><strong>Current Status</strong>${esc(a.current_status) || '—'}</div>
      <div class="app-field"><strong>Email</strong>${esc(a.email) || '—'}</div>
    </div>
    <div class="app-field"><strong>Public Bio</strong>${esc(a.public_bio) || '—'}</div>
    <div class="app-field"><strong>Standardized Tests</strong>
      ${tests.length ? tests.map(t => {
        const score = testScores[t];
        return `<span class="pill pill-blue" style="margin-right:4px">${esc(t)}${score != null ? ` <strong>${score}</strong>` : ''}</span>`;
      }).join('') : '—'}
    </div>
    ${Object.keys(testSubs).length ? `<div class="app-field"><strong>Test Subjects</strong>${Object.entries(testSubs).map(([k,v])=>`<div style="margin-top:4px"><em>${esc(k)}:</em> ${Array.isArray(v)?v.map(s=>esc(s)).join(', '):esc(v)}</div>`).join('')}</div>` : ''}
    <div class="app-field"><strong>Wants to Teach</strong>
      ${subjects.map(s => `<span class="pill pill-blue" style="margin-right:4px">${esc(s)}</span>`).join('') || '—'}
    </div>
    ${a.id_document_url ? `<div class="app-field"><strong>ID Document</strong><a href="${esc(a.id_document_url)}" target="_blank" rel="noopener" style="color:var(--blue)"><i class="fas fa-file"></i> View Document</a></div>` : ''}
    ${a.video_pitch_url ? `<div class="app-field"><strong>Video Pitch</strong><br>
      <video class="video-pitch-player" controls preload="metadata" style="width:100%;max-width:520px;border-radius:10px;background:#000;display:block;margin-bottom:8px">
        <source src="${esc(a.video_pitch_url)}" type="video/webm">
        <source src="${esc(a.video_pitch_url)}" type="video/mp4">
        <source src="${esc(a.video_pitch_url)}" type="video/ogg">
      </video>
      <a href="${esc(a.video_pitch_url)}" target="_blank" rel="noopener" style="font-size:.78rem;color:var(--blue)"><i class="fas fa-external-link-alt"></i> Open / download video</a>
    </div>` : '<div class="app-field"><strong>Video Pitch</strong><span style="color:var(--gray-400)">No video submitted</span></div>'}
    ${a.admin_notes ? `<div class="app-field"><strong>Admin Notes</strong>${esc(a.admin_notes)}</div>` : ''}
    ${a.status === 'pending' ? `
    <div class="app-actions">
      <div style="flex:1">
        <label class="form-label" style="margin-bottom:4px">Approved Subjects (leave blank to use applicant's selection)</label>
        <input class="form-input" id="subj-${a.id}" placeholder="e.g. Mathematics, Physics (comma-separated)">
      </div>
    </div>
    <div class="app-actions">
      <div style="flex:1">
        <label class="form-label" style="margin-bottom:4px">Admin Note (optional, sent to applicant)</label>
        <input class="form-input" id="note-${a.id}" placeholder="Feedback for the applicant…">
      </div>
    </div>
    <div class="app-actions">
      <button class="btn btn-success" onclick="reviewApp(${a.id},'approve')"><i class="fas fa-check"></i> Approve</button>
      <button class="btn btn-danger" onclick="reviewApp(${a.id},'decline')"><i class="fas fa-times"></i> Decline</button>
    </div>` : ''}
  </div>`;
}

async function reviewApp(appId, action) {
  const noteEl = document.getElementById('note-' + appId);
  const subjEl = document.getElementById('subj-' + appId);
  const notes  = noteEl ? noteEl.value.trim() : '';
  let approvedSubjects = [];
  if (subjEl && subjEl.value.trim()) {
    approvedSubjects = subjEl.value.split(',').map(s => s.trim()).filter(Boolean);
  }

  const res = await aFetch('/api/admin.php?action=review_application', 'POST', {
    application_id: appId,
    action,
    admin_notes: notes,
    approved_subjects: approvedSubjects,
  });

  if (res.success) {
    aToast(action === 'approve' ? 'Application approved! User enrolled in training.' : 'Application declined.', action === 'approve' ? 'success' : 'info');
    document.getElementById('app-' + appId)?.remove();
    loadStats();
  } else {
    aToast(res.error || 'Error', 'error');
  }
}

/* ── Sessions ────────────────────────────────────────────── */
async function renderSessions() {
  const res = await aFetch('/api/admin.php?action=sessions');
  const sessions = res.success ? res.data : [];
  const statusColor = { upcoming:'pill-blue', live:'pill-green', ended:'pill-gray', cancelled:'pill-red' };

  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1>All Sessions</h1>
      <p>Overview of all teaching sessions on the platform</p>
    </div>
    <div class="admin-card">
      <table class="admin-table">
        <thead><tr>
          <th>Title</th><th>Teacher</th><th>Subject</th><th>Scheduled</th><th>Duration</th><th>Students</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${sessions.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:var(--gray-400);padding:32px">No sessions yet</td></tr>' :
            sessions.map(s => `<tr>
              <td style="font-weight:600">${esc(s.title)}</td>
              <td>${esc(s.first_name)} ${esc(s.last_name)}</td>
              <td><span class="pill pill-blue">${esc(s.subject)}</span></td>
              <td style="font-size:.8rem">${formatDate(s.scheduled_at)}</td>
              <td>${s.duration_minutes} min</td>
              <td>${s.registered_count}/${s.max_students}</td>
              <td><span class="pill ${statusColor[s.status]||'pill-gray'}">${s.status}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ── Users ───────────────────────────────────────────────── */
async function renderUsers() {
  const res = await aFetch('/api/admin.php?action=users');
  const users = res.success ? res.data : [];
  const roleColor = { student:'pill-gray', teacher_pending_training:'pill-orange', active_teacher:'pill-green', admin:'pill-blue' };

  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1>All Users</h1>
      <p>Total: ${users.length} users</p>
    </div>
    <div class="admin-card">
      <div class="admin-card-header">
        <h2>User Directory</h2>
        <input class="form-input" id="userSearch" placeholder="Search by name or username…" style="width:220px" oninput="filterUsers(this.value)">
      </div>
      <table class="admin-table" id="usersTable">
        <thead><tr>
          <th>User</th><th>Username</th><th>Email</th><th>Role</th><th>XP</th><th>Joined</th>
        </tr></thead>
        <tbody id="usersTbody">
          ${users.map(u => `<tr>
            <td style="font-weight:600">${esc(u.first_name)} ${esc(u.last_name)}</td>
            <td style="color:var(--gray-400)">@${esc(u.username)}</td>
            <td style="font-size:.8rem">${esc(u.email)||'—'}</td>
            <td><span class="pill ${roleColor[u.role]||'pill-gray'}">${(u.role||'student').replace(/_/g,' ')}</span></td>
            <td>${u.xp||0}</td>
            <td style="font-size:.78rem;color:var(--gray-400)">${formatDate(u.created_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  // Store for filtering
  window._adminUsers = users;
}

function filterUsers(q) {
  const lower = q.toLowerCase();
  const tbody  = document.getElementById('usersTbody');
  if (!tbody || !window._adminUsers) return;
  const users  = window._adminUsers;
  tbody.innerHTML = users.filter(u =>
    (u.first_name+' '+u.last_name).toLowerCase().includes(lower) ||
    (u.username||'').toLowerCase().includes(lower) ||
    (u.email||'').toLowerCase().includes(lower)
  ).map(u => {
    const roleColor = { student:'pill-gray', teacher_pending_training:'pill-orange', active_teacher:'pill-green' };
    return `<tr>
      <td style="font-weight:600">${esc(u.first_name)} ${esc(u.last_name)}</td>
      <td style="color:var(--gray-400)">@${esc(u.username)}</td>
      <td style="font-size:.8rem">${esc(u.email)||'—'}</td>
      <td><span class="pill ${roleColor[u.role]||'pill-gray'}">${(u.role||'student').replace(/_/g,' ')}</span></td>
      <td>${u.xp||0}</td>
      <td style="font-size:.78rem;color:var(--gray-400)">${new Date(u.created_at).toLocaleDateString()}</td>
    </tr>`;
  }).join('');
}

/* ── Email Composer ──────────────────────────────────────── */
async function renderEmail() {
  const usersRes = await aFetch('/api/admin.php?action=users');
  const users = usersRes.success ? usersRes.data : [];

  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1>Send Email</h1>
      <p>Send a branded Learnora email to a user or broadcast to everyone</p>
    </div>
    <div class="admin-card" style="max-width:700px">
      <div class="admin-card-header"><h2>Compose Email</h2></div>
      <div style="padding:20px">
        <div class="form-group">
          <label class="form-label">Recipient</label>
          <select class="form-select" id="emailTarget">
            <option value="all">Broadcast to ALL users</option>
            ${users.map(u => `<option value="${u.id}">${esc(u.first_name)} ${esc(u.last_name)} (@${esc(u.username)}) — ${esc(u.email||'no email')}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Subject Line</label>
          <input class="form-input" id="emailSubject" placeholder="e.g. Important update from Learnora">
        </div>
        <div class="form-group">
          <label class="form-label">Preview Text (shown in inbox before opening)</label>
          <input class="form-input" id="emailPreview" placeholder="Short preview sentence…">
        </div>
        <div class="form-group">
          <label class="form-label">Message Body</label>
          <div id="richEditor">
            <textarea class="form-textarea" id="emailBody" placeholder="Write your message here. HTML is supported for rich formatting.&#10;&#10;Example:&#10;&lt;p&gt;Hello,&lt;/p&gt;&#10;&lt;p&gt;We have an exciting update...&lt;/p&gt;" style="min-height:200px;font-family:monospace;font-size:.82rem"></textarea>
          </div>
          <div style="font-size:.75rem;color:var(--gray-400);margin-top:4px">HTML is supported. The message will be wrapped in the Learnora branded email template automatically.</div>
        </div>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="sendAdminEmail()"><i class="fas fa-paper-plane"></i> Send Email</button>
          <button class="btn btn-ghost" onclick="previewEmail()"><i class="fas fa-eye"></i> Preview</button>
        </div>
        <div id="emailResult" style="margin-top:12px"></div>
      </div>
    </div>
  `;
}

async function sendAdminEmail() {
  const target  = document.getElementById('emailTarget').value;
  const subject = document.getElementById('emailSubject').value.trim();
  const preview = document.getElementById('emailPreview').value.trim();
  const message = document.getElementById('emailBody').value.trim();

  if (!subject || !message) { aToast('Subject and message are required', 'error'); return; }

  const btn = event.target.closest('button');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending…';

  const res = await aFetch('/api/admin.php?action=send_email', 'POST', { target, subject, preview, message });

  btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Email';

  if (res.success) {
    const msg = res.data.broadcast ? `Broadcast sent to ${res.data.sent} users` : 'Email sent successfully';
    aToast(msg);
    document.getElementById('emailResult').innerHTML = `<div style="background:#dcfce7;border-radius:8px;padding:10px 14px;color:#15803d;font-size:.85rem;font-weight:600">✓ ${msg}</div>`;
  } else {
    aToast(res.error || 'Failed to send', 'error');
  }
}

function previewEmail() {
  const subject = document.getElementById('emailSubject').value || 'Preview';
  const message = document.getElementById('emailBody').value || '';
  const win = window.open('', '_blank');
  win.document.write(`<title>Preview: ${subject}</title>${message}`);
}

/* ── Content Reports ─────────────────────────────────────── */
let _reportsFilter = 'open';
async function renderReports(filter) {
  _reportsFilter = filter || _reportsFilter;
  const res = await aFetch('/api/admin.php?action=list_reports&status=' + _reportsFilter);
  const reports = res.success ? res.data : [];

  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1>Content Reports</h1>
      <p>Review and moderate reported posts and comments</p>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab${_reportsFilter==='open'?' active':''}" onclick="renderReports('open')">Open</button>
      <button class="admin-tab${_reportsFilter==='resolved'?' active':''}" onclick="renderReports('resolved')">Resolved</button>
      <button class="admin-tab${_reportsFilter==='dismissed'?' active':''}" onclick="renderReports('dismissed')">Dismissed</button>
    </div>
    <div id="reportsList">
      ${reports.length === 0
        ? '<div class="admin-empty"><i class="fas fa-check-circle"></i><p>No ' + _reportsFilter + ' reports</p></div>'
        : reports.map(renderReportCard).join('')}
    </div>
  `;
}

function renderReportCard(r) {
  const reasonColors = { spam:'pill-orange', harassment:'pill-red', inappropriate:'pill-red', misinformation:'pill-blue', other:'pill-gray' };
  return `
  <div class="app-card" id="report-${r.id}">
    <div class="app-card-header">
      <div>
        <h3>${esc(r.target_type === 'post' ? 'Post Report' : 'Comment Report')}
          <span class="pill ${reasonColors[r.reason]||'pill-gray'}" style="font-size:.7rem;vertical-align:middle">${esc(r.reason)}</span>
        </h3>
        <small>Reported by @${esc(r.reporter_username)} · ${formatDate(r.created_at)}</small>
      </div>
    </div>
    <div class="app-field"><strong>Content Preview</strong>${esc(r.content_preview || '[Content no longer exists]')}</div>
    ${r.details ? `<div class="app-field"><strong>Reporter's Note</strong>${esc(r.details)}</div>` : ''}
    ${r.status === 'open' ? `
    <div class="app-actions">
      <button class="btn btn-danger btn-sm" onclick="deleteReported(${r.id},'${esc(r.target_type)}',${r.target_id})">
        <i class="fas fa-trash"></i> Delete Content &amp; Resolve
      </button>
      <button class="btn btn-ghost btn-sm" onclick="resolveReport(${r.id},'dismissed')">
        <i class="fas fa-check"></i> Dismiss
      </button>
      <button class="btn btn-ghost btn-sm" onclick="resolveReport(${r.id},'resolved')">
        <i class="fas fa-archive"></i> Mark Resolved
      </button>
    </div>` : `<div style="font-size:.8rem;color:var(--gray-400)">Status: ${r.status}${r.resolved_at ? ' · ' + formatDate(r.resolved_at) : ''}</div>`}
  </div>`;
}

async function resolveReport(reportId, action) {
  const res = await aFetch('/api/admin.php?action=resolve_report', 'POST', { report_id: reportId, action });
  if (res.success) {
    aToast('Report ' + action);
    document.getElementById('report-' + reportId)?.remove();
    loadStats();
  } else {
    aToast(res.error || 'Failed', 'error');
  }
}

async function deleteReported(reportId, targetType, targetId) {
  if (!confirm('Permanently delete this ' + targetType + '? This cannot be undone.')) return;
  const res = await aFetch('/api/admin.php?action=delete_reported', 'POST', { report_id: reportId, target_type: targetType, target_id: targetId });
  if (res.success) {
    aToast('Content deleted and report resolved', 'success');
    document.getElementById('report-' + reportId)?.remove();
    loadStats();
  } else {
    aToast(res.error || 'Failed', 'error');
  }
}

/* ── Helpers ─────────────────────────────────────────────── */
function tryParse(str, fallback) {
  try { return JSON.parse(str) || fallback; } catch(e) { return fallback; }
}

function adminLogout() {
  localStorage.removeItem('learnora_token');
  window.location.href = 'index.html';
}
</script>
