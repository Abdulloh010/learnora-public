<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnora Test Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 1.4rem; color: #29ABE2; margin-bottom: 8px; }
    .meta { font-size: 0.82rem; color: #64748b; margin-bottom: 24px; }
    .summary { display: flex; gap: 16px; margin-bottom: 24px; }
    .pill { padding: 6px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .pill.pass { background: #064e3b; color: #34d399; }
    .pill.fail { background: #450a0a; color: #f87171; }
    .pill.total { background: #1e293b; color: #94a3b8; }
    .suite { margin-bottom: 20px; }
    .suite-name { font-size: 0.9rem; font-weight: 700; color: #94a3b8; text-transform: uppercase;
                  letter-spacing: 0.08em; margin-bottom: 8px; padding-bottom: 4px;
                  border-bottom: 1px solid #1e293b; }
    .test { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid #0f172a; font-size: 0.85rem; }
    .icon { width: 18px; flex-shrink: 0; font-size: 1rem; line-height: 1; }
    .desc { flex: 1; }
    .detail { font-size: 0.75rem; color: #ef4444; margin-top: 4px;
              background: #1e293b; padding: 4px 8px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Learnora Test Runner</h1>
  <p class="meta" id="meta"></p>
  <div class="summary" id="summary"></div>
  <div id="output"></div>

  <script src="learnora.test.js"></script>
  <script>
    const passed = results.filter(r => r.pass).length;
    const failed = results.filter(r => !r.pass).length;
    const total  = results.length;

    document.getElementById('meta').textContent =
      `Run at ${new Date().toLocaleString()} — ${total} assertions across ${[...new Set(results.map(r => r.suite))].length} suites`;

    document.getElementById('summary').innerHTML = `
      <span class="pill pass">✓ ${passed} passed</span>
      ${failed ? `<span class="pill fail">✗ ${failed} failed</span>` : ''}
      <span class="pill total">${total} total</span>
    `;

    const bySuite = {};
    results.forEach(r => { (bySuite[r.suite] = bySuite[r.suite] || []).push(r); });

    const out = document.getElementById('output');
    Object.entries(bySuite).forEach(([suite, tests]) => {
      const suiteEl = document.createElement('div');
      suiteEl.className = 'suite';
      const suitePass = tests.filter(t => t.pass).length;
      suiteEl.innerHTML = `<div class="suite-name">${suite} &nbsp; <span style="font-weight:400;font-size:0.78rem">${suitePass}/${tests.length}</span></div>`;
      tests.forEach(t => {
        const div = document.createElement('div');
        div.className = 'test';
        div.innerHTML = `
          <span class="icon">${t.pass ? '✅' : '❌'}</span>
          <span class="desc">
            ${t.desc}
            ${!t.pass ? `<div class="detail">got: ${JSON.stringify(t.actual)}<br>exp: ${JSON.stringify(t.expected)}</div>` : ''}
          </span>`;
        suiteEl.appendChild(div);
      });
      out.appendChild(suiteEl);
    });

    document.title = `${failed ? '❌' : '✅'} Learnora Tests (${passed}/${total})`;
    console.log(`Tests: ${passed}/${total} passed${failed ? ` — ${failed} FAILED` : ' ✓'}`);
  </script>
</body>
</html>
